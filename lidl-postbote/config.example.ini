# Kopiere diese Datei nach config.ini und trage deine Daten ein.
# config.ini enthält Zugangsdaten: nie weitergeben, nie hochladen.

[lidl]
# Refresh-Token aus "lidl-plus auth". Das Programm ersetzt ihn automatisch,
# weil Lidl bei jeder Anmeldung einen neuen ausgibt.
refresh_token =
land = DE
sprache = de

[gmail]
# Deine Gmail-Adresse. An sie werden die Bons geschickt, von ihr aus wird gesendet.
adresse = deinname@gmail.com
# 16-stelliges App-Passwort von https://myaccount.google.com/apppasswords
# (nicht dein normales Google-Passwort). Leerzeichen sind egal.
app_passwort =
smtp_server = smtp.gmail.com
smtp_port = 465
